name: Publish package

on:
  workflow_dispatch:
    inputs:
      target:
        description: Package index
        type: choice
        required: true
        default: testpypi
        options:
          - testpypi
          - pypi

permissions:
  contents: read

concurrency:
  group: publish-${{ inputs.target }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Verify production release tag
        env:
          PUBLISH_TARGET: ${{ inputs.target }}
        run: |
          python - <<'PY'
          import os
          import tomllib
          from pathlib import Path
          version = tomllib.loads(Path("pyproject.toml").read_text())["project"]["version"]
          if os.environ["PUBLISH_TARGET"] == "pypi":
              expected = f"refs/tags/v{version}"
              if os.environ["GITHUB_REF"] != expected:
                  raise SystemExit(f"Select tag v{version} when running this workflow for PyPI.")
          PY
      - name: Install build tools
        run: python -m pip install build twine
      - name: Build distributions
        run: python -m build
      - name: Check metadata and README
        run: python -m twine check --strict dist/*
      - name: Install and test the built wheel
        run: |
          python -m pip install dist/*.whl
          python -I -m unittest discover -s tests -v
      - uses: actions/upload-artifact@v5
        with:
          name: distributions
          path: dist/
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: ${{ inputs.target }}
      url: ${{ inputs.target == 'pypi' && 'https://pypi.org/p/chickensmoothie' || 'https://test.pypi.org/p/chickensmoothie' }}
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v6
        with:
          name: distributions
          path: dist/
      - name: Publish using Trusted Publishing
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: ${{ inputs.target == 'pypi' && 'https://upload.pypi.org/legacy/' || 'https://test.pypi.org/legacy/' }}
